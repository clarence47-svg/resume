[project]
name = "profile-agent-service"
version = "0.3.0"
description = "An evidence-backed LangGraph service for profiles, job matching, resumes, and safe applications."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "charset-normalizer>=3.4,<4",
    "cryptography>=44,<46",
    "docling>=2.30,<3",
    "fastapi>=0.115,<1",
    "filetype>=1.2,<2",
    "httpx>=0.28,<1",
    "langchain-core>=0.3.70,<2",
    "langchain-openai>=0.3.20,<2",
    "langgraph>=0.6,<2",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "markdown-it-py>=3,<5",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "playwright>=1.52,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "rapidocr-onnxruntime>=1.4,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.42,<2",
    "torch>=2.2,<3; sys_platform == 'linux'",
    "torchvision>=0.17,<1; sys_platform == 'linux'",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agents",
    "src/applications",
    "src/campaigns",
    "src/career",
    "src/client",
    "src/core",
    "src/ingestion",
    "src/interview",
    "src/job_search",
    "src/jobs",
    "src/memory",
    "src/matching",
    "src/profile",
    "src/resumes",
    "src/schema",
    "src/service",
    "src/storage",
    "src/tracking",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
